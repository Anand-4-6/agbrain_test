<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="690 110 700 700" role="img" aria-labelledby="title desc">
  <title id="title">BrainTest hero draft: care begins here</title>
  <desc id="desc">A blended hero concept with a patient's thought, guided assessment, doctor-ready topics, and an invitation to conversation. Care begins here is highlighted in a warm circle.</desc>
  <defs>
    <radialGradient id="bg" cx="76%" cy="48%" r="60%"><stop stop-color="#e0eee4"/><stop offset=".55" stop-color="#f3f7f1"/><stop offset="1" stop-color="#f8f9f6"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#b7dec7" stop-opacity=".6"/><stop offset="1" stop-color="#dceee2" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f4f4ed"/></linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6d9bc"/><stop offset="1" stop-color="#e9ad91"/></linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d79d83"/><stop offset=".5" stop-color="#70a88d"/><stop offset="1" stop-color="#2d7368"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#214a3e" flood-opacity=".14"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".028"/></feComponentTransfer></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <ellipse cx="1036" cy="477" rx="420" ry="372" fill="url(#glow)"/>
  <ellipse cx="1155" cy="307" rx="184" ry="152" fill="#f5e8d8" opacity=".7" filter="url(#soft)"/>
  <path d="M0 84H1440" stroke="#e2eae3"/>

  <!-- Small site shell, so the draft reads as a hero section. -->
  <g transform="translate(60 27)"><g transform="rotate(-12 14 14)"><rect x="0" y="1" width="11" height="11" rx="5" fill="#368271"/><rect x="15" y="1" width="11" height="11" rx="5" fill="#81b79a"/><rect x="0" y="16" width="11" height="11" rx="5" fill="#81b79a"/><rect x="15" y="16" width="11" height="11" rx="5" fill="#b9d0a7"/></g><text x="42" y="25" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1.6" fill="#153b38">brain<tspan fill="#458b79">test</tspan><tspan fill="#e9ad86">.</tspan></text></g>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#667a72"><text x="570" y="51" fill="#153b38">Home</text><text x="660" y="51">Tests</text><text x="745" y="51">Dashboard</text><text x="875" y="51">Pricing</text></g>
  <path d="M570 83H610" stroke="#39796d" stroke-width="2"/>
  <rect x="1231" y="19" width="151" height="46" rx="7" fill="none" stroke="#b8cbc1"/><text x="1252" y="47" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#174741">Explore tests</text><path d="M1350 42l10-10m-8 0h8v8" stroke="#174741" stroke-width="1.6" fill="none"/>

  <!-- Main copy -->
  <line x1="60" y1="171" x2="84" y2="171" stroke="#79ae92"/>
  <text x="98" y="175" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.15" fill="#528677">A THOUGHTFUL FIRST STEP IN MENTAL HEALTH</text>
  <text x="59" y="277" font-family="Georgia,serif" font-size="75" letter-spacing="-4" fill="#143834">A clearer mind</text>
  <text x="59" y="365" font-family="Georgia,serif" font-size="75" letter-spacing="-4" fill="#143834">starts with</text>
  <text x="59" y="453" font-family="Georgia,serif" font-size="75" font-style="italic" letter-spacing="-4" fill="#5b9c84">understanding.</text>
  <text x="60" y="513" font-family="Arial,sans-serif" font-size="17" fill="#647a70">Private, approachable assessments that help you</text>
  <text x="60" y="541" font-family="Arial,sans-serif" font-size="17" fill="#647a70">prepare for a better conversation with your doctor.</text>
  <rect x="60" y="581" width="211" height="53" rx="6" fill="#1d5550"/><text x="79" y="613" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Explore assessments</text><path d="M239 607l8-8m-6 0h6v6" fill="none" stroke="white" stroke-width="1.4"/>
  <text x="309" y="613" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#164b43">Meet our doctors</text><path d="M449 609h14m-5-5 5 5-5 5" fill="none" stroke="#164b43" stroke-width="1.3"/><path d="M309 630h155" stroke="#a5b9a9"/>
  <g font-family="Arial,sans-serif" fill="#83948a"><text x="61" y="705" font-family="Georgia,serif" font-size="31" fill="#143834">12k<tspan fill="#65a786">+</tspan></text><text x="61" y="728" font-size="11">patient assessments</text><path d="M218 676v54" stroke="#d6e2d9"/><text x="248" y="705" font-family="Georgia,serif" font-size="31" fill="#143834">150<tspan fill="#65a786">+</tspan></text><text x="248" y="728" font-size="11">doctors connected</text></g>
  <text x="61" y="766" font-family="Arial,sans-serif" font-size="10" fill="#95a59a">Illustrative figures for this design draft.</text>

  <!-- One continuous, softly blended journey. -->
  <path d="M711 685C779 602 742 446 879 376C1008 309 1059 337 1174 404C1282 468 1295 603 1214 738" fill="none" stroke="#b8d9c4" stroke-width="120" opacity=".22" stroke-linecap="round"/>
  <path d="M755 354C826 334 837 324 867 348C931 398 919 482 1003 504C1100 528 1166 515 1205 592C1233 647 1228 703 1186 743" fill="none" stroke="url(#thread)" stroke-width="4" opacity=".8" stroke-linecap="round" stroke-dasharray="1 11"/>
  <circle cx="864" cy="348" r="9" fill="#e6b395" stroke="white" stroke-width="5"/>
  <circle cx="1003" cy="504" r="9" fill="#76aa8f" stroke="white" stroke-width="5"/>
  <circle cx="1205" cy="592" r="9" fill="#3c8775" stroke="white" stroke-width="5"/>

  <!-- Personal starting thought -->
  <g transform="rotate(-5 846 281)" filter="url(#shadow)">
    <rect x="742" y="201" width="286" height="165" rx="13" fill="url(#paper)"/>
    <path d="M763 239h29" stroke="#daae91" stroke-width="2"/>
    <text x="802" y="244" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5" font-weight="700" fill="#a68e7e">IN MY OWN WORDS</text>
    <text x="765" y="282" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#254b42">“I’m not sure how to</text>
    <text x="765" y="310" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#254b42">explain how I’ve been</text>
    <text x="765" y="338" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#254b42">feeling.”</text>
  </g>

  <!-- Emphasized human promise, integrated with the visual rather than a UI widget. -->
  <g filter="url(#shadow)"><circle cx="1223" cy="247" r="106" fill="url(#seal)"/><circle cx="1223" cy="247" r="91" fill="none" stroke="#fff6ea" stroke-width="2" opacity=".7"/></g>
  <text x="1223" y="214" font-family="Georgia,serif" font-size="33" font-style="italic" text-anchor="middle" fill="#17433f">Care</text>
  <text x="1223" y="247" font-family="Georgia,serif" font-size="30" font-style="italic" text-anchor="middle" fill="#17433f">begins</text>
  <text x="1223" y="280" font-family="Georgia,serif" font-size="32" font-style="italic" text-anchor="middle" fill="#17433f">here.</text>
  <path d="M1176 301q47 19 92 0" fill="none" stroke="#a46153" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Assessment is a gentle bridge rather than a diagnosis. -->
  <g transform="rotate(3 970 474)" filter="url(#shadow)">
    <rect x="833" y="392" width="321" height="179" rx="13" fill="#fffefa"/>
    <text x="857" y="425" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#57917a">A GUIDED CHECK-IN</text>
    <text x="1090" y="425" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9caf9e">02 / 05</text>
    <path d="M857 441h272" stroke="#e4ece3" stroke-width="5" stroke-linecap="round"/><path d="M857 441h94" stroke="#74b28d" stroke-width="5" stroke-linecap="round"/>
    <text x="857" y="479" font-family="Georgia,serif" font-size="21" fill="#173f38">What has felt different lately?</text>
    <rect x="857" y="499" width="79" height="34" rx="17" fill="#e7f2e8"/><rect x="945" y="499" width="85" height="34" rx="17" fill="#f1f5ef"/><rect x="1039" y="499" width="90" height="34" rx="17" fill="#f1f5ef"/>
    <text x="880" y="520" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#448269">Sleep</text><text x="966" y="520" font-family="Arial,sans-serif" font-size="12" fill="#668077">Energy</text><text x="1064" y="520" font-family="Arial,sans-serif" font-size="12" fill="#668077">Mood</text>
    <text x="857" y="552" font-family="Arial,sans-serif" font-size="10" fill="#a1afa4">A sample question for this visual concept</text>
  </g>

  <!-- Doctor-ready discussion topics -->
  <g transform="translate(80 0) rotate(-4 1131 638)" filter="url(#shadow)">
    <rect x="1002" y="570" width="285" height="157" rx="13" fill="url(#paper)"/>
    <text x="1023" y="600" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3" font-weight="700" fill="#5d927d">FOR YOUR CONVERSATION</text>
    <text x="1023" y="630" font-family="Georgia,serif" font-size="20" fill="#173f38">Topics to discuss</text>
    <g font-family="Arial,sans-serif" font-size="12" fill="#5a7467"><circle cx="1028" cy="654" r="4" fill="#91b9a1"/><text x="1042" y="658">Sleep and rest</text><circle cx="1028" cy="677" r="4" fill="#91b9a1"/><text x="1042" y="681">Changes in energy</text><circle cx="1028" cy="700" r="4" fill="#91b9a1"/><text x="1042" y="704">What has changed over time</text></g>
  </g>

  <!-- Conversation card completes the journey. -->
  <g filter="url(#shadow)"><rect x="710" y="667" width="350" height="111" rx="16" fill="#1e5750"/></g>
  <text x="737" y="693" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#a9d4b8">THE NEXT CONVERSATION</text>
  <text x="737" y="728" font-family="Georgia,serif" font-size="23" font-style="italic" fill="#fffdf5">“Let’s talk about what’s</text>
  <text x="737" y="756" font-family="Georgia,serif" font-size="23" font-style="italic" fill="#fffdf5">been changing.”</text>
  <rect width="1440" height="900" filter="url(#grain)" opacity=".38"/>
  <g font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.9" fill="#8ca79a"><text x="60" y="858">CONFIDENTIAL BY DESIGN</text><path d="M248 855H1188" stroke="#dce5dc"/><text x="1210" y="858">CARE STARTS HERE</text></g>
</svg>
